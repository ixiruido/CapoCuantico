    <style>
    /* Efecto de fondo respirando */
    body {
      margin: 0;
      height: 100vh;
      background-color: #FFFFFF; /* color inicial */
      animation: respirar 8s infinite alternate;
      color: black; /* texto visible sobre fondo claro */
      font-family: Arial, sans-serif;
    }

   @keyframes respirar {
  0%   { background-color: #FFFFFF; }
  25%  { background-color: #F0F0F0; }
  50%  { background-color: #E0E0E0; }
  75%  { background-color: #F0F0F0; }
  100% { background-color: #FFFFFF; }
}.slider {
  width: 85%;      
  margin: 0 auto;    
}

.slider img {
  width: 85%;  
  height: auto; 
}

.thumbnails {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  gap: 5px;
  flex-wrap: wrap;
}

.thumbnails img {
  width: 6%;      
  height: auto;     
  object-fit: cover; 
  cursor: pointer;   
  border: 2px solid transparent;  
  transition: border 0.3s;
}

.thumbnails img.active {
  border: 2px solid #111;
}
body {
padding: 35px 30%;}
  
@media (max-width: 700px){
body {
padding: 10px 10%;}
}


</style>
